# Helix 实验配置：日常只修改这个文件，一行一个参数。
# 训练默认值已于 2026-11-26 通过 SSH 核对：
# /data/home/sczd744/run/dear_pytorch-master/dear/horovod_mpi_cj.sh
# 及同目录 bert_benchmark.py。不是旧冒烟测试的缩短参数。
# 本文件为 INI 格式：等号右边直接写值，不加引号，不写 export。

[job]
name = HELIX_NVTX_DEFAULT
nodes = 4
# 可选：请求指定节点，对应 sbatch --nodelist；空值或省略时不限制节点。
# 如需固定两个节点，可同时设置 nodes=2、nodelist=g0014,g0022。
# 也支持 Slurm 表达式 g[0014,0022]；INI 中不用引号。
nodelist =
# 可选：排除节点，对应 sbatch --exclude，例如 g0017,g0018。
exclude =
# 当前入口每节点一个 rank、一张 GPU；rank 数自动等于 nodes。
gpus_per_node = 1
# auto 或省略本项：不指定 CPU 数，使用 Slurm 的实际默认分配。
# 当前 gpu 分区 DefCpuPerGPU=8，每节点一张 GPU 时默认分配 8 个 CPU。
# 显式填 1/4/8 会覆盖这个默认值。
cpus_per_task = auto
partition = gpu
qos = gpugpu
# 资源时限是本入口的申请值，不是 Python 训练参数。
# 恢复完整默认训练后，不能继续沿用冒烟测试的 10 分钟时限。
time_limit = 02:00:00
# 相对项目根目录；每次提交自动创建独立子目录。
output_root = dear/logs/nvtx

[paths]
# auto 表示本入口所在的 Dear 项目根目录，不依赖终端当前目录。
project_root = auto
# 相对本入口所在目录；软件与网络环境仍在该文件管理。
env_script = env_sczd744.sh
nsys_package = /data/home/sczd744/tools/packages/NsightSystems-linux-cli-public-2026.5.1.161-3889610.deb

[training]
model = bert_base
batch_size = 64
sentence_len = 64
# 预热前还会有一次初始训练调用，编号为全局 step 0。
num_warmup_batches = 10
num_batches_per_iter = 10
num_iters = 1000
nstreams = 1
# 原 MPI 压缩分支实际使用 64 MiB，并非 threshold 变量表面的 0。
threshold = 67108864
loss_log_every = 0

[compression]
compressor = halfrankk
density = 0.125
rank = 16
warmup = 5000
refresh_k = 0
min_numel = 16384
# 恢复服务器默认的动态策略；fixed 才表示始终使用固定 rank。
rank_schedule = update_norm_stable
rank_overrides =
rank_reset_on_change = 0
active_prefix_enabled = 1
embedding_policy = word
stable_rank_levels = 16,12,8
update_norm_stable_tol = 0.05
update_norm_critical_tol = 0.8
update_norm_patience = 20
update_norm_smoothing = 0.8
update_norm_debug_every = 101

[runtime]
event_sync = 1
# 原默认未启用下列命令行开关。fp16 指通信压缩选项，并非 AMP。
fp16 = 0
rdma = 0
mgwfbp = 0
asc = 0
nccl_debug = INFO

[capture]
# 算子分析：nsys_enabled=1、nvtx_enabled=1、autograd=1。
# 无采集吞吐对照：nsys_enabled=0、nvtx_enabled=0、autograd=0。
nsys_enabled = 1
nvtx_enabled = 1
autograd = 1
# 全局 step 从 0 开始，包含初始调用与训练预热，不是 Iter 编号。
# 默认 W=10、每轮 B=10 时：Iter #i 首步 = 1 + W + i*B。
# 以下核心窗口为 Iter #520--523，即 step 5211--5250。
# 必须在压缩启用（当前 step 5001）及训练预热之后采集。
start_step = 5211
steps = 40
# 多记录一步，用于消费核心窗口最后一步的延迟解码与更新。
tail_steps = 1
trace = cuda,nvtx,osrt
# process-tree：采集每个 rank 及其子进程的原生 CPU 函数热点。
# none：关闭 CPU 指令/调用栈采样，仍记录上面的 CUDA/NVTX/OSRT。
# 计算节点必须允许 perf 采样；启动前会检查，权限不足则明确报错。
sample = process-tree
